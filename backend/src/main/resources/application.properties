spring.application.name=dispatch
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dispatch_db}
spring.datasource.username=${DB_USER:dispatch_user}
spring.datasource.password=${DB_PASSWORD:dispatch_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=${PORT:8080}

ai.provider=groq
ai.groq.api.key=${GROQ_API_KEY:}
ai.groq.model=qwen/qwen3.8-27b
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
